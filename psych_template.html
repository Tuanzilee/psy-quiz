<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="普心刷題">
<meta name="theme-color" content="#0a0a0f">
<meta name="robots" content="noindex, nofollow">
<title>普心刷題</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Space+Mono:wght@400;700&display=swap');

:root {
  --bg: #0a0a0f;
  --bg2: #111118;
  --surface: #16161f;
  --surface2: #1e1e2a;
  --border: #252535;
  --border2: #32324a;
  --text: #e8e8f0;
  --muted: #6b6b8a;
  --dim: #3a3a55;

  --blue: #4f6ef7;
  --blue-light: #6b85ff;
  --blue-glow: rgba(79,110,247,0.12);

  --green: #3dd68c;
  --green-bg: rgba(61,214,140,0.08);
  --yellow: #f5c842;
  --yellow-bg: rgba(245,200,66,0.08);
  --red: #f75f5f;
  --red-bg: rgba(247,95,95,0.08);
  --purple: #a78bfa;
  --purple-bg: rgba(167,139,250,0.08);

  --radius: 10px;
  --safe-top: env(safe-area-inset-top);
  --safe-bottom: env(safe-area-inset-bottom);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans TC', sans-serif;
  font-size: 15px;
  line-height: 1.6;
  overflow: hidden;
}

/* ── APP SHELL ── */
#app {
  display: flex;
  flex-direction: column;
  height: 100%;
  height: 100dvh;
  max-width: 680px;
  margin: 0 auto;
  position: relative;
}

/* ── HEADER ── */
.header {
  padding: 12px 16px 10px;
  padding-top: calc(12px + var(--safe-top));
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--bg);
  position: relative;
  z-index: 10;
  flex-shrink: 0;
}
.header-title {
  font-family: 'Space Mono', monospace;
  font-size: 13px;
  font-weight: 700;
  color: var(--blue-light);
  letter-spacing: 0.04em;
}
.header-sub {
  font-size: 11px;
  color: var(--muted);
  margin-left: auto;
}
.header-btn {
  width: 32px; height: 32px;
  border-radius: 8px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--muted);
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 14px;
  flex-shrink: 0;
}
.header-btn:active { opacity: 0.7; }

/* ── BOTTOM NAV ── */
.bottom-nav {
  display: flex;
  border-top: 1px solid var(--border);
  background: var(--bg);
  padding-bottom: var(--safe-bottom);
  flex-shrink: 0;
}
.nav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  padding: 10px 0 8px;
  cursor: pointer;
  color: var(--dim);
  transition: color 0.15s;
  font-size: 10px;
  font-weight: 500;
}
.nav-item.active { color: var(--blue-light); }
.nav-item svg { width: 20px; height: 20px; }

/* ── PAGES ── */
.page {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
  display: none;
}
.page.active { display: block; }
.page::-webkit-scrollbar { display: none; }

/* ── LOADING ── */
#loading {
  position: fixed;
  inset: 0;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  z-index: 999;
}
.loading-logo {
  font-family: 'Space Mono', monospace;
  font-size: 18px;
  font-weight: 700;
  color: var(--blue-light);
}
.loading-bar {
  width: 120px;
  height: 2px;
  background: var(--border);
  border-radius: 1px;
  overflow: hidden;
}
.loading-fill {
  height: 100%;
  background: var(--blue);
  border-radius: 1px;
  animation: loadbar 1.2s ease-in-out infinite;
}
@keyframes loadbar {
  0% { width: 0; }
  50% { width: 80%; }
  100% { width: 100%; }
}

/* ── HOME PAGE ── */
.home-section { padding: 16px; }
.section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 10px;
}

/* Stats row */
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 20px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 10px;
  text-align: center;
}
.stat-num {
  font-family: 'Space Mono', monospace;
  font-size: 22px;
  font-weight: 700;
  color: var(--text);
  line-height: 1;
  margin-bottom: 3px;
}
.stat-num.green { color: var(--green); }
.stat-num.yellow { color: var(--yellow); }
.stat-num.red { color: var(--red); }
.stat-label { font-size: 10px; color: var(--muted); }

/* Quick start buttons */
.quick-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 20px;
}
.quick-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 12px;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.quick-card:active { background: var(--surface2); transform: scale(0.98); }
.quick-card .icon { font-size: 20px; }
.quick-card .label { font-size: 13px; font-weight: 500; }
.quick-card .sub { font-size: 11px; color: var(--muted); }
.quick-card.highlight {
  border-color: var(--blue);
  background: var(--blue-glow);
}
.quick-card.highlight .label { color: var(--blue-light); }

/* Concept chips */
.concept-scroll {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  padding-bottom: 4px;
  margin-bottom: 20px;
}
.concept-scroll::-webkit-scrollbar { display: none; }
.concept-chip {
  flex-shrink: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 99px;
  padding: 5px 12px;
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
.concept-chip:active { color: var(--blue-light); border-color: var(--blue); background: var(--blue-glow); }

/* Weak topics */
.weak-list { display: flex; flex-direction: column; gap: 6px; }
.weak-item {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}
.weak-bar-wrap { flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
.weak-bar { height: 100%; border-radius: 2px; }
.weak-name { font-size: 12px; color: var(--muted); min-width: 80px; }
.weak-pct { font-size: 11px; font-family: 'Space Mono', monospace; color: var(--red); min-width: 30px; text-align: right; }

/* ── BROWSE PAGE ── */
.filter-bar {
  padding: 8px 16px;
  display: flex;
  gap: 6px;
  overflow-x: auto;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.filter-bar + .filter-bar {
  border-top: none;
  padding-top: 4px;
}
.filter-bar:has(+ .filter-bar) {
  border-bottom: none;
  padding-bottom: 4px;
}
.filter-bar::-webkit-scrollbar { display: none; }
.filter-pill {
  flex-shrink: 0;
  padding: 5px 12px;
  border-radius: 99px;
  font-size: 12px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}
.filter-pill.active {
  background: var(--blue-glow);
  border-color: var(--blue);
  color: var(--blue-light);
}

.search-wrap { padding: 10px 16px; border-bottom: 1px solid var(--border); }
.search-input {
  width: 100%;
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: 8px;
  padding: 8px 12px;
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  outline: none;
}
.search-input::placeholder { color: var(--dim); }
.search-input:focus { border-color: var(--blue); }

.q-list { padding: 8px 0; }
.q-row {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  transition: background 0.1s;
}
.q-row:active { background: var(--surface); }
.q-row-status {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 6px;
}
.q-row-status.correct { background: var(--green); }
.q-row-status.wrong { background: var(--red); }
.q-row-status.unsure { background: var(--yellow); }
.q-row-status.unmarked { background: var(--dim); }
.q-row-body { flex: 1; min-width: 0; }
.q-row-id {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--blue);
  margin-bottom: 2px;
}
.q-row-text {
  font-size: 13px;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.4;
}
.q-row-tags { display: flex; gap: 4px; margin-top: 5px; flex-wrap: wrap; }
.q-row-tag {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 3px;
  background: var(--surface2);
  color: var(--dim);
}
.q-row-diff {
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 4px;
  flex-shrink: 0;
  font-weight: 500;
}
.q-row-diff.easy { background: var(--green-bg); color: var(--green); }
.q-row-diff.medium { background: var(--yellow-bg); color: var(--yellow); }
.q-row-diff.hard { background: var(--red-bg); color: var(--red); }

/* ── QUIZ PAGE (QUESTION VIEW) ── */
.quiz-header {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  flex-shrink: 0;
}
.quiz-back {
  width: 32px; height: 32px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  color: var(--muted);
  font-size: 18px;
}
.quiz-progress {
  flex: 1;
  height: 3px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
}
.quiz-progress-fill {
  height: 100%;
  background: var(--blue);
  border-radius: 2px;
  transition: width 0.3s;
}
.quiz-counter {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}

.quiz-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }

.q-meta { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }

/* ── 勘誤功能 ── */
.q-edit-btn {
  margin-left: auto;
  background: var(--surface);
  border: 1px solid var(--border2);
  color: var(--muted);
  width: 28px; height: 28px;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.12s;
  padding: 0;
}
.q-edit-btn:hover, .q-edit-btn:active {
  background: var(--blue-glow);
  border-color: var(--blue);
  color: var(--blue-light);
}
.q-corrected-badge {
  background: rgba(255,180,0,0.12);
  border: 1px solid rgba(255,180,0,0.4);
  color: #ffc857;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
.edit-field {
  width: 100%;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--text);
  font-size: 13px;
  font-family: inherit;
  box-sizing: border-box;
}
.edit-field:focus {
  outline: none;
  border-color: var(--blue);
}
.corrections-list {
  max-height: 50vh;
  overflow-y: auto;
  background: var(--surface);
  border-radius: 8px;
  padding: 10px;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  line-height: 1.7;
}
.corr-entry { margin-bottom: 10px; }
.corr-entry-id { color: var(--blue-light); font-weight: 700; }
.corr-entry-line { padding-left: 10px; color: var(--text); }

/* ── 進階編輯摺疊區 ── */
.edit-advanced {
  margin-top: 4px;
  border-top: 1px solid var(--border);
  padding-top: 12px;
}
.edit-advanced-toggle {
  font-size: 12px;
  color: var(--muted);
  cursor: pointer;
  padding: 6px 0;
  user-select: none;
  display: flex;
  align-items: center;
  gap: 6px;
}
.edit-advanced-toggle:hover { color: var(--blue-light); }
.edit-advanced-toggle::before {
  content: '▶';
  font-size: 9px;
  transition: transform 0.15s;
}
.edit-advanced.open .edit-advanced-toggle::before { transform: rotate(90deg); }
.edit-advanced-body { display: none; padding-top: 8px; }
.edit-advanced.open .edit-advanced-body { display: block; }

/* ── 個人備註顯示 ── */
.personal-note-box {
  background: rgba(80, 160, 255, 0.06);
  border-left: 3px solid var(--blue);
  padding: 10px 12px;
  border-radius: 4px;
  margin: 10px 0;
  font-size: 13px;
  line-height: 1.7;
  color: var(--text);
  white-space: pre-wrap;
  word-break: break-word;
}
.personal-note-label {
  font-size: 10px;
  color: var(--blue-light);
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  margin-bottom: 4px;
}
.q-badge {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--border2);
  color: var(--muted);
  background: var(--surface);
}
.q-badge.school { color: var(--blue-light); border-color: rgba(79,110,247,0.3); background: var(--blue-glow); }
.q-badge.type-choice { color: var(--blue-light); border-color: rgba(79,110,247,0.3); background: var(--blue-glow); }
.q-badge.type-tf { color: #6dd; border-color: rgba(110,221,221,0.3); background: rgba(110,221,221,0.08); }
.q-badge.type-match { color: var(--purple); border-color: rgba(167,139,250,0.3); background: var(--purple-bg); }
.q-badge.type-essay { color: #ffa86b; border-color: rgba(255,168,107,0.35); background: rgba(255,168,107,0.08); }

.q-text {
  font-size: 15px;
  line-height: 1.75;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 14px;
}
.q-prompt {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: var(--blue-light);
  text-transform: uppercase;
  padding-bottom: 8px;
  margin-bottom: 8px;
  border-bottom: 1px dashed var(--border);
}

/* Options */
.options { display: flex; flex-direction: column; gap: 8px; }
.option {
  padding: 11px 14px;
  border-radius: 8px;
  border: 1.5px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  font-size: 14px;
  line-height: 1.5;
  display: flex;
  gap: 10px;
  align-items: flex-start;
  transition: all 0.15s;
  color: var(--text);
}
.option:active { transform: scale(0.99); }
.option.selected { border-color: var(--blue); background: var(--blue-glow); }
.option.correct { border-color: var(--green); background: var(--green-bg); }
.option.wrong { border-color: var(--red); background: var(--red-bg); }
.option.reveal-correct { border-color: var(--green); background: var(--green-bg); }
.option-key {
  font-family: 'Space Mono', monospace;
  font-size: 12px;
  font-weight: 700;
  flex-shrink: 0;
  margin-top: 1px;
}
.option.correct .option-key { color: var(--green); }
.option.wrong .option-key { color: var(--red); }
.option.reveal-correct .option-key { color: var(--green); }

/* Answer input (non-MC) */
.answer-input-wrap { display: flex; flex-direction: column; gap: 8px; }
.answer-input {
  width: 100%;
  background: var(--surface);
  border: 1.5px solid var(--border2);
  border-radius: 8px;
  padding: 10px 12px;
  color: var(--text);
  font-size: 14px;
  font-family: inherit;
  outline: none;
  resize: none;
  min-height: 80px;
  line-height: 1.5;
}
.answer-input:focus { border-color: var(--blue); }

/* Keyword grading */
.kw-hint {
  font-size: 11px;
  color: var(--muted);
  margin-top: 8px;
  padding: 0 2px;
  letter-spacing: 0.04em;
}
.kw-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 6px;
}
.kw-chip {
  font-size: 12px;
  padding: 3px 10px;
  border-radius: 99px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--muted);
  transition: all 0.2s;
}
.kw-chip.hit {
  color: var(--green);
  border-color: rgba(61,214,140,0.5);
  background: var(--green-bg);
  font-weight: 500;
}
.kw-chip.miss {
  color: var(--red);
  border-color: rgba(247,95,95,0.4);
  background: var(--red-bg);
  text-decoration: line-through;
  text-decoration-color: rgba(247,95,95,0.5);
}

/* Action buttons */
.action-row { display: flex; gap: 8px; }
.btn {
  flex: 1;
  padding: 12px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  border: 1.5px solid;
  font-family: inherit;
  transition: all 0.15s;
  text-align: center;
}
.btn:active { transform: scale(0.98); opacity: 0.85; }
.btn-primary { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn-outline { background: transparent; border-color: var(--border2); color: var(--muted); }
.btn-ghost { background: var(--surface); border-color: var(--border); color: var(--muted); }

/* Mark buttons */
.mark-row {
  display: flex;
  gap: 6px;
}
.mark-btn {
  flex: 1;
  padding: 8px 6px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid;
  font-family: inherit;
  text-align: center;
  transition: all 0.15s;
}
.mark-btn:active { transform: scale(0.97); }
.mark-btn.correct-btn { border-color: rgba(61,214,140,0.4); color: var(--green); background: var(--green-bg); }
.mark-btn.correct-btn.active { background: var(--green); color: #000; border-color: var(--green); }
.mark-btn.unsure-btn { border-color: rgba(245,200,66,0.4); color: var(--yellow); background: var(--yellow-bg); }
.mark-btn.unsure-btn.active { background: var(--yellow); color: #000; border-color: var(--yellow); }
.mark-btn.wrong-btn { border-color: rgba(247,95,95,0.4); color: var(--red); background: var(--red-bg); }
.mark-btn.wrong-btn.active { background: var(--red); color: #fff; border-color: var(--red); }

/* ── SOLUTION PANEL ── */
.solution-panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  display: none;
}
.solution-panel.show { display: block; }
.solution-tab-row {
  display: flex;
  border-bottom: 1px solid var(--border);
}
.solution-tab {
  flex: 1;
  padding: 10px;
  text-align: center;
  font-size: 12px;
  font-weight: 500;
  color: var(--muted);
  cursor: pointer;
  border-bottom: 2px solid transparent;
  transition: all 0.15s;
}
.solution-tab.active { color: var(--blue-light); border-bottom-color: var(--blue); }

.solution-content { padding: 14px; display: none; }
.solution-content.active { display: block; }

.slabel {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--dim);
  text-transform: uppercase;
  margin-bottom: 8px;
}

.steps { display: flex; flex-direction: column; gap: 6px; }
.step {
  display: flex;
  gap: 9px;
  align-items: flex-start;
  padding: 8px 10px;
  background: var(--bg2);
  border-radius: 6px;
  border-left: 2px solid var(--blue);
  font-size: 13px;
  line-height: 1.55;
}
.step-n {
  font-family: 'Space Mono', monospace;
  font-size: 10px;
  color: var(--blue);
  flex-shrink: 0;
  min-width: 18px;
  margin-top: 2px;
}

.key-box {
  padding: 10px 12px;
  background: var(--blue-glow);
  border: 1px solid rgba(79,110,247,0.2);
  border-radius: 7px;
  font-size: 13px;
  color: #8fa4ff;
  line-height: 1.55;
  margin-bottom: 10px;
}
.hint-box {
  padding: 10px 12px;
  background: var(--yellow-bg);
  border: 1px solid rgba(245,200,66,0.2);
  border-radius: 7px;
  font-size: 13px;
  color: #d4aa30;
  line-height: 1.55;
}
.hint-label {

  font-weight: 700;

.formula-item {

.concept-tags { display: flex; flex-wrap: wrap; gap: 5px; }
.concept-tag {
  font-size: 11px;
  padding: 3px 8px;

  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--muted);
}

/* ── CONCEPTS PAGE ── */
.concept-grid {
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.concept-row {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 11px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: all 0.12s;
}
.concept-row:active { background: var(--surface2); }
.concept-name { flex: 1; font-size: 13px; }
.concept-count {
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  color: var(--muted);
}
.concept-acc {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 700;
  font-family: 'Space Mono', monospace;
  flex-shrink: 0;
}
.concept-acc.good { background: var(--green-bg); color: var(--green); border: 1px solid rgba(61,214,140,0.3); }
.concept-acc.mid { background: var(--yellow-bg); color: var(--yellow); border: 1px solid rgba(245,200,66,0.3); }
.concept-acc.bad { background: var(--red-bg); color: var(--red); border: 1px solid rgba(247,95,95,0.3); }
.concept-acc.none { background: var(--surface2); color: var(--dim); border: 1px solid var(--border); }

/* ── MODALS ── */
.modal-bg {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  display: none;
  align-items: flex-end;
}
.modal-bg.show { display: flex; }
.modal {
  background: var(--bg2);
  border-top: 1px solid var(--border2);
  border-radius: 18px 18px 0 0;
  width: 100%;
  max-height: 80vh;
  overflow-y: auto;
  padding: 20px 16px;
  padding-bottom: calc(20px + var(--safe-bottom));
}
.modal-handle {
  width: 36px; height: 4px;
  background: var(--border2);
  border-radius: 2px;
  margin: 0 auto 16px;
}
.modal-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; }

.filter-section { margin-bottom: 16px; }
.filter-section-label { font-size: 11px; color: var(--muted); margin-bottom: 8px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
.filter-chips { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-chip {
  padding: 6px 12px;
  border-radius: 99px;
  font-size: 12px;
  border: 1px solid var(--border2);
  background: var(--surface);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.12s;
}
.filter-chip.active {
  background: var(--blue-glow);
  border-color: var(--blue);
  color: var(--blue-light);
}

/* ── MISC ── */
.divider { height: 1px; background: var(--border); margin: 12px 0; }
.empty {
  padding: 48px 24px;
  text-align: center;
  color: var(--dim);
  font-size: 13px;
  line-height: 1.7;
}
.empty-icon { font-size: 32px; margin-bottom: 10px; }

.correct-answer-reveal {
  padding: 10px 12px;
  background: var(--green-bg);
  border: 1px solid rgba(61,214,140,0.25);
  border-radius: 7px;
  font-size: 13px;
  color: var(--green);
  line-height: 1.5;
}

/* Scroll indicator */
.scroll-hint {
  text-align: center;
  font-size: 11px;
  color: var(--dim);
  padding: 6px;
  animation: pulse 2s infinite;
}
@keyframes pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }

/* Answer reveal section */
.reveal-section {
  padding: 10px 12px;
  border-radius: 8px;
  margin-top: 4px;
  display: none;
}
.reveal-section.correct-reveal {
  background: var(--green-bg);
  border: 1px solid rgba(61,214,140,0.25);

.reveal-section.wrong-reveal {

.reveal-result.correct { color: var(--green); }
.reveal-result.wrong { color: var(--red); }

/* Skeleton */
.skeleton {
  background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.4s infinite;
  border-radius: 6px;
}
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
</style>

<script>
// ─── STATE ───────────────────────────────────────────────────────────────────
let questions = [];
let records = {};      // { id: { status: 'correct'|'wrong'|'unsure', ts } }
let quizQueue = [];
let quizIdx = 0;
let currentQ = null;
let answered = false;
let currentTab = 'steps';
let bf = { school: 'all', year: 'all', type: 'all', status: 'all' };
let activeFilters = { school: 'all', diff: 'all', type: 'all' };
let conceptFilter = '';
let browseSearchQ = '';

const RECORDS_KEY = 'psych_records_v1';
const CORRECTIONS_KEY = 'psych_corrections_v1';
const NOTES_KEY = 'psych_notes_v1';
const CHAPTERS = [
  '第1章 緒論', '第2章 心理學方法', '第3章 行為的生物基礎', '第4章 感覺與知覺',
  '第5章 注意與意識', '第6章 學習', '第7章 記憶', '第8章 語言與心智表徵',
  '第9章 思考與創造力', '第10章 智力', '第11章 動機與情緒', '第12章 性格',
  '第13章 社會心理學', '第14章 發展心理學', '第15章 壓力、適應與健康', '第16章 心智異常'
];
let corrections = {};
let personalNotes = {};

function loadCorrections() {
  try { corrections = JSON.parse(localStorage.getItem(CORRECTIONS_KEY) || '{}'); }
  catch(e) { corrections = {}; }
  try { personalNotes = JSON.parse(localStorage.getItem(NOTES_KEY) || '{}'); }
  catch(e) { personalNotes = {}; }
}
function saveCorrections() {
  localStorage.setItem(CORRECTIONS_KEY, JSON.stringify(corrections));
}
function savePersonalNotes() {
  localStorage.setItem(NOTES_KEY, JSON.stringify(personalNotes));
}
function getPersonalNote(id) { return personalNotes[id] || ''; }

// 把勘誤資料套用到 questions 陣列；若某勘誤值與原值相同（已被同步進 repo），自動清除
function applyCorrectionsToQuestions() {
  let dirty = false;
  for (const id of Object.keys(corrections)) {
    const q = questions.find(x => x.id === id);
    if (!q) { delete corrections[id]; dirty = true; continue; }
    for (const field of Object.keys(corrections[id])) {
      if (field.startsWith('_')) continue;
      const newVal = corrections[id][field];
      // 若 repo 端已經更新成同樣值，自動清除這筆勘誤
      if (newVal === q[field]) {
        delete corrections[id][field];
        dirty = true;
        continue;
      }
      // 套用
      if (!q._original) q._original = {};
      if (!(field in q._original)) q._original[field] = q[field];
      q[field] = newVal;
      if (field === 'topic' && q.section) q.section.title = newVal;
    }
    // 若整筆 entry 沒有任何欄位變更，移除
    const realFields = Object.keys(corrections[id]).filter(k => !k.startsWith('_'));
    if (realFields.length === 0) { delete corrections[id]; dirty = true; }
  }
  if (dirty) saveCorrections();
}

function isCorrected(qid) {
  return corrections[qid] && Object.keys(corrections[qid]).some(k => !k.startsWith('_'));
}

function correctionsCount() {
  return Object.keys(corrections).length;
}

let _editAnswer = null;

function openEditPanel() {
  if (!currentQ) return;
  const isMultiChoice = currentQ.options && currentQ.options.length > 0;
  const orig = currentQ._original || {};
  _editAnswer = currentQ.answer;
  const html = `
    <div class="modal-bg show" id="edit-modal" onclick="closeEditPanel(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-title">編輯 — ${currentQ.id}</div>
        <div style="font-size:11px;color:var(--muted);margin-bottom:14px;line-height:1.6">
          <strong style="color:var(--blue-light)">勘誤</strong>（答案/章節/解析等）會進匯出清單以同步進 repo；
          <strong style="color:var(--blue-light)">個人備註</strong>只存於本機，不會匯出。
        </div>
        ${isMultiChoice ? `
          <div class="filter-section">
            <div class="filter-section-label">答案${orig.answer ? ` (原: ${orig.answer})` : ''}</div>
            <div class="filter-chips" id="edit-answer-chips">
              ${'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.slice(0, currentQ.options.length).split('').map(L =>
                `<div class="filter-chip ${currentQ.answer === L ? 'active' : ''}" onclick="pickEditAnswer('${L}',this)">${L}</div>`
              ).join('')}
            </div>
          </div>
        ` : ''}
        <div class="filter-section">
          <div class="filter-section-label">章節${orig.topic ? ` (原: ${orig.topic})` : ''}</div>
          <select id="edit-topic" class="edit-field">
            ${CHAPTERS.map(ch => `<option value="${esc(ch)}" ${currentQ.topic === ch ? 'selected' : ''}>${ch}</option>`).join('')}
            ${(!CHAPTERS.includes(currentQ.topic) && currentQ.topic) ? `<option value="${esc(currentQ.topic)}" selected>${currentQ.topic}（不在標準 16 章）</option>` : ''}
          </select>
        </div>
        <div class="filter-section">
          <div class="filter-section-label">註記${orig.answer_note !== undefined ? ' (已修改)' : ''}</div>
          <textarea id="edit-note" rows="2" class="edit-field" style="resize:vertical" placeholder="例：教科書 P.123 已確認">${(currentQ.answer_note || '').replace(/</g,'&lt;')}</textarea>
        </div>

        <div class="edit-advanced" id="edit-advanced">
          <div class="edit-advanced-toggle" onclick="toggleEditAdvanced()">進階編輯（解析 / 提示 / 個人備註）</div>
          <div class="edit-advanced-body">
            <div class="filter-section">
              <div class="filter-section-label">解析（reference_answer）${orig.reference_answer !== undefined ? ' (已修改)' : ''}</div>
              <textarea id="edit-ref" rows="5" class="edit-field" style="resize:vertical;font-size:12px;line-height:1.6">${(currentQ.reference_answer || '').replace(/</g,'&lt;')}</textarea>
            </div>
            <div class="filter-section">
              <div class="filter-section-label">AI 提示（ai_hint）${orig.ai_hint !== undefined ? ' (已修改)' : ''}</div>
              <textarea id="edit-hint" rows="3" class="edit-field" style="resize:vertical;font-size:12px;line-height:1.6">${(currentQ.ai_hint || '').replace(/</g,'&lt;')}</textarea>
            </div>
            <div class="filter-section">
              <div class="filter-section-label" style="color:var(--blue-light)">個人備註（不匯出，只存本機）</div>
              <textarea id="edit-personal" rows="3" class="edit-field" style="resize:vertical;font-size:12px;line-height:1.6" placeholder="記憶口訣、自己的思路、不懂的地方…">${getPersonalNote(currentQ.id).replace(/</g,'&lt;')}</textarea>
            </div>
          </div>
        </div>

        <div class="action-row" style="flex-wrap:wrap">
          ${isCorrected(currentQ.id) ? `<button class="btn btn-ghost" onclick="revertEdit()" style="color:var(--red);flex:1 1 100%;margin-bottom:6px">↶ 還原原始版本（保留個人備註）</button>` : ''}
          <button class="btn btn-outline" onclick="closeEditPanel()">取消</button>
          <button class="btn btn-primary" onclick="saveEdit()">儲存</button>
        </div>
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', html);
  // 若已修改進階欄位，預設展開
  if (orig.reference_answer !== undefined || orig.ai_hint !== undefined || getPersonalNote(currentQ.id)) {
    document.getElementById('edit-advanced').classList.add('open');
  }
}

function toggleEditAdvanced() {
  document.getElementById('edit-advanced').classList.toggle('open');
}

function pickEditAnswer(letter, el) {
  _editAnswer = letter;
  document.querySelectorAll('#edit-answer-chips .filter-chip').forEach(x => x.classList.remove('active'));
  el.classList.add('active');
}

function saveEdit() {
  if (!currentQ) return;
  const isMultiChoice = currentQ.options && currentQ.options.length > 0;
  const newAnswer = _editAnswer;
  const newTopic = document.getElementById('edit-topic')?.value;
  const newNote = (document.getElementById('edit-note')?.value || '').trim();
  const newRef = (document.getElementById('edit-ref')?.value || '').trim();
  const newHint = (document.getElementById('edit-hint')?.value || '').trim();
  const newPersonal = (document.getElementById('edit-personal')?.value || '').trim();

  if (!currentQ._original) currentQ._original = {};
  if (!corrections[currentQ.id]) corrections[currentQ.id] = {};

  function setField(field, val) {
    if (val === currentQ[field]) return;
    if (!(field in currentQ._original)) currentQ._original[field] = currentQ[field];
    currentQ[field] = val;
    corrections[currentQ.id][field] = val;
    if (field === 'topic' && currentQ.section) currentQ.section.title = val;
  }

  if (isMultiChoice && newAnswer && newAnswer !== currentQ.answer) {
    setField('answer', newAnswer);
  }
  if (newTopic && newTopic !== currentQ.topic) {
    setField('topic', newTopic);
  }
  if (newNote !== (currentQ.answer_note || '').trim()) {
    setField('answer_note', newNote);
  }
  if (newRef !== (currentQ.reference_answer || '').trim()) {
    setField('reference_answer', newRef);
  }
  if (newHint !== (currentQ.ai_hint || '').trim()) {
    setField('ai_hint', newHint);
  }

  // 個人備註：獨立 namespace、不進 corrections
  if (newPersonal) {
    personalNotes[currentQ.id] = newPersonal;
  } else {
    delete personalNotes[currentQ.id];
  }
  savePersonalNotes();

  // 整理：若沒有任何變更，移除空 entry
  const realFields = Object.keys(corrections[currentQ.id]).filter(k => !k.startsWith('_'));
  if (realFields.length === 0) {
    delete corrections[currentQ.id];
  } else {
    corrections[currentQ.id]._ts = Date.now();
  }
  saveCorrections();
  _editAnswer = null;
  closeEditPanel();
  showQuestion();
}

function revertEdit() {
  if (!confirm('確定還原為原始版本？此題的勘誤會被移除。')) return;
  if (currentQ._original) {
    for (const k of Object.keys(currentQ._original)) {
      currentQ[k] = currentQ._original[k];
    }
    if (currentQ.section && currentQ.topic) currentQ.section.title = currentQ.topic;
    delete currentQ._original;
  }
  delete corrections[currentQ.id];
  saveCorrections();
  _editAnswer = null;
  closeEditPanel();
  showQuestion();
}

function closeEditPanel() {
  const m = document.getElementById('edit-modal');
  if (m) m.remove();
}

function openCorrectionsModal() {
  const ids = Object.keys(corrections);
  const qmap = Object.fromEntries(questions.map(q => [q.id, q]));
  const items = ids.map(id => {
    const q = qmap[id];
    if (!q) return null;
    const corr = corrections[id];
    const orig = q._original || {};
    const lines = [];
    const labels = { answer: '答案', topic: '章節', answer_note: '註記', ai_hint: '提示', reference_answer: '解析' };
    for (const f of ['answer', 'topic', 'answer_note', 'ai_hint', 'reference_answer']) {
      if (!(f in corr)) continue;
      const o = orig[f] !== undefined ? orig[f] : '';
      const n = corr[f];
      if (f === 'answer_note' || f === 'ai_hint' || f === 'reference_answer') {
        const np = n.length > 30 ? n.slice(0, 30) + '…' : n;
        lines.push(`${labels[f]}: ${n ? `「${np}」` : '(清空)'}`);
      } else {
        lines.push(`${labels[f]}: ${o || '(空)'} → ${n}`);
      }
    }
    return { id, lines };
  }).filter(Boolean);

  const html = `
    <div class="modal-bg show" id="corrections-modal" onclick="closeCorrectionsModal(event)">
      <div class="modal" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-title">勘誤管理 (${items.length} 筆)</div>
        ${items.length === 0 ? `
          <div class="empty" style="padding:32px 0;text-align:center;color:var(--muted);font-size:13px">
            還沒有任何勘誤<br><br>
            <span style="font-size:11px;color:var(--dim)">在刷題畫面點題目右上角的 ✏ 圖示開始編輯</span>
          </div>
          <div class="action-row">
            <button class="btn btn-outline" onclick="closeCorrectionsModal()">關閉</button>
          </div>
        ` : `
          <div style="font-size:11px;color:var(--muted);margin-bottom:12px;line-height:1.6">
            修改即時生效（存於本機）。複製清單貼給 AI 同步進 repo，<br>
            或自己改 JSON。同步後再點清空。
          </div>
          <div class="corrections-list">
            ${items.map(it => `
              <div class="corr-entry">
                <div class="corr-entry-id">${it.id}</div>
                ${it.lines.map(ln => `<div class="corr-entry-line">${ln}</div>`).join('')}
              </div>
            `).join('')}
          </div>
          <div style="height:14px"></div>
          <div class="action-row" style="flex-wrap:wrap;gap:6px">
            <button class="btn btn-ghost" onclick="clearAllCorrections()" style="color:var(--red);flex:1 1 100%;margin-bottom:4px">🗑 清空全部</button>
            <button class="btn btn-outline" onclick="closeCorrectionsModal()">關閉</button>
            <button class="btn btn-primary" onclick="copyCorrectionsList()">📋 複製清單</button>
          </div>
        `}
      </div>
    </div>
  `;
  document.body.insertAdjacentHTML('beforeend', html);
}

function closeCorrectionsModal() {
  const m = document.getElementById('corrections-modal');
  if (m) m.remove();
}

function copyCorrectionsList() {
  const ids = Object.keys(corrections);
  const qmap = Object.fromEntries(questions.map(q => [q.id, q]));
  const today = new Date().toISOString().slice(0, 10);
  const lines = [`# 勘誤清單 (${ids.length} 筆) — ${today}`, ''];
  for (const id of ids) {
    const q = qmap[id];
    if (!q) continue;
    const corr = corrections[id];
    const orig = q._original || {};
    const fragments = [];
    if ('answer' in corr) fragments.push(`answer: ${orig.answer || '(空)'} → ${corr.answer}`);
    if ('topic' in corr) fragments.push(`topic: ${orig.topic || '(空)'} → ${corr.topic}`);
    if ('answer_note' in corr) {
      const note = corr.answer_note.replace(/\n/g, ' ');
      fragments.push(`answer_note: ${note ? `「${note}」` : '(清空)'}`);
    }
    if ('ai_hint' in corr) {
      const hint = corr.ai_hint.replace(/\n/g, ' ');
      const short = hint.length > 60 ? hint.slice(0, 60) + '…' : hint;
      fragments.push(`ai_hint: ${hint ? `「${short}」 (完整內容請看 app)` : '(清空)'}`);
    }
    if ('reference_answer' in corr) {
      const ref = corr.reference_answer.replace(/\n/g, ' ');
      const short = ref.length > 60 ? ref.slice(0, 60) + '…' : ref;
      fragments.push(`reference_answer: ${ref ? `「${short}」 (完整內容請看 app)` : '(清空)'}`);
    }
    if (fragments.length > 0) lines.push(`${id}  ${fragments.join('; ')}`);
  }
  // 若有解析或提示被改，附上完整內容區塊
  const fullEdits = ids.filter(id => {
    const c = corrections[id];
    return ('reference_answer' in c) || ('ai_hint' in c);
  });
  if (fullEdits.length > 0) {
    lines.push('');
    lines.push('## 完整修改內容');
    for (const id of fullEdits) {
      const c = corrections[id];
      lines.push('');
      lines.push(`### ${id}`);
      if ('reference_answer' in c) {
        lines.push('reference_answer:');
        lines.push(c.reference_answer || '(清空)');
      }
      if ('ai_hint' in c) {
        lines.push('ai_hint:');
        lines.push(c.ai_hint || '(清空)');
      }
    }
  }
  const text = lines.join('\n');

  function fallbackCopy() {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch(e) {}
    ta.remove();
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(
      () => alert(`已複製 ${ids.length} 筆勘誤到剪貼簿`),
      () => { fallbackCopy(); alert(`已複製 ${ids.length} 筆`); }
    );
  } else {
    fallbackCopy();
    alert(`已複製 ${ids.length} 筆`);
  }
}

function clearAllCorrections() {
  const n = correctionsCount();
  if (!confirm(`確定清空全部 ${n} 筆勘誤？\n\n所有題目會還原為 repo 中的原始版本。\n通常在你已把勘誤同步進 repo 後才這樣做。`)) return;
  for (const q of questions) {
    if (q._original) {
      for (const k of Object.keys(q._original)) q[k] = q._original[k];
      if (q.section && q.topic) q.section.title = q.topic;
      delete q._original;
    }
  }
  corrections = {};
  saveCorrections();
  closeCorrectionsModal();
  if (document.getElementById('page-quiz').classList.contains('active') && currentQ) {
    showQuestion();
  } else {
    renderHome();
  }
}

// Chapter ordering: 第1章, 第2章, ... 第16章
function chapterNum(topic) {
  const m = (topic || '').match(/第(\d+)章/);
  return m ? parseInt(m[1]) : 999;
}

// ─── INIT ────────────────────────────────────────────────────────────────────
async function init() {
  loadRecords();
  loadCorrections();
  try {
    questions = window.__QUESTIONS__ || [];
    if (!questions.length) throw new Error('題庫未注入');
    applyCorrectionsToQuestions();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    renderHome();
    renderBrowse();
    renderChapters();
    updateHeaderSub();
  } catch(e) {
    document.querySelector('.loading-logo').textContent = '載入失敗';
    document.querySelector('.loading-fill').style.background = '#f75f5f';
    document.querySelector('.loading-fill').style.animation = 'none';
    document.querySelector('.loading-fill').style.width = '100%';
    console.error('題庫載入失敗:', e);
  }
}

function loadRecords() {
  try { records = JSON.parse(localStorage.getItem(RECORDS_KEY) || '{}'); } catch(e) { records = {}; }
}
function saveRecords() {
  localStorage.setItem(RECORDS_KEY, JSON.stringify(records));
}
function getStatus(id) { return records[id]?.status || 'unmarked'; }

function updateHeaderSub() {
  const done = Object.keys(records).length;
  const total = questions.length;
  document.getElementById('header-sub').textContent = `${done}/${total} 題`;
}

// ─── NAVIGATION ──────────────────────────────────────────────────────────────
const pages = ['page-home','page-browse','page-chapters','page-quiz'];
const navIds = ['nav-home','nav-browse','nav-chapters',null];

function goPage(pageId) {
  pages.forEach((p,i) => {
    document.getElementById(p).classList.toggle('active', p === pageId);
    if (navIds[i]) document.getElementById(navIds[i]).classList.toggle('active', p === pageId);
  });
  // Hide bottom nav during quiz
  document.querySelector('.bottom-nav').style.display = pageId === 'page-quiz' ? 'none' : 'flex';
  document.querySelector('.header').style.display = pageId === 'page-quiz' ? 'none' : 'flex';
  if (pageId === 'page-browse') renderBrowse();
  if (pageId === 'page-chapters') renderChapters();
  if (pageId === 'page-home') renderHome();
}

// ─── HOME ────────────────────────────────────────────────────────────────────
function renderHome() {
  const correct = Object.values(records).filter(r=>r.status==='correct').length;
  const wrong = Object.values(records).filter(r=>r.status==='wrong').length;
  const unsure = Object.values(records).filter(r=>r.status==='unsure').length;

  document.getElementById('stat-total').textContent = questions.length;
  document.getElementById('stat-correct').textContent = correct;
  document.getElementById('stat-wrong').textContent = wrong;
  document.getElementById('wrong-count').textContent = wrong + ' 題待複習';
  document.getElementById('unsure-count').textContent = unsure + ' 題';
  const cc = correctionsCount();
  const ccEl = document.getElementById('corrections-count');
  if (ccEl) ccEl.textContent = cc === 0 ? '尚無勘誤' : `${cc} 筆 — 點此匯出`;

  // Top chapters (by question count)
  const chCounts = {};
  questions.forEach(q => {
    const ch = q.topic || '其他';
    chCounts[ch] = (chCounts[ch] || 0) + 1;
  });
  const topCh = Object.entries(chCounts).sort((a,b) => chapterNum(a[0]) - chapterNum(b[0]));
  document.getElementById('home-chapters').innerHTML = topCh.map(([c, n]) =>
    `<div class="concept-chip" onclick="startChapterQuiz('${esc(c)}')">${c} · ${n}</div>`
  ).join('');

  // Weak chapters (by error rate)
  const chStats = {};
  questions.forEach(q => {
    const ch = q.topic || '其他';
    if (!chStats[ch]) chStats[ch] = {total:0, wrong:0};
    chStats[ch].total++;
    if (getStatus(q.id) === 'wrong') chStats[ch].wrong++;
  });
  const weak = Object.entries(chStats)
    .filter(([,s]) => s.total >= 2 && s.wrong > 0)
    .map(([c,s]) => [c, s.wrong/s.total, s.wrong])
    .sort((a,b) => b[1]-a[1]).slice(0,5);

  if (weak.length === 0) {
    document.getElementById('weak-list').innerHTML = `<div style="font-size:11px;color:var(--dim);padding:8px 0;text-align:center">刷完幾題後這裡會顯示你的弱點</div>`;
  } else {
    document.getElementById('weak-list').innerHTML = weak.map(([c,pct,n]) => `
      <div class="weak-item" onclick="startChapterQuiz('${esc(c)}')">
        <div class="weak-name">${c}</div>
        <div class="weak-bar-wrap"><div class="weak-bar" style="width:${pct*100}%;background:${pct>0.6?'var(--red)':pct>0.3?'var(--yellow)':'var(--green)'}"></div></div>
        <div class="weak-pct">${Math.round(pct*100)}%錯</div>
      </div>`).join('');
  }
}

// ─── BROWSE ──────────────────────────────────────────────────────────────────
function jumpToBrowse(status) {
  // Reset all dim filters, set status (status='all' shows everything)
  bf = { school: 'all', year: 'all', type: 'all', status: status };
  // Sync pill active classes for all four dims
  document.querySelectorAll('.filter-pill[data-dim]').forEach(p => {
    p.classList.toggle('active', p.dataset.val === bf[p.dataset.dim]);
  });
  // Clear search
  const si = document.getElementById('browse-search');
  if (si) si.value = '';
  browseSearchQ = '';
  goPage('page-browse');
}

function browseFilter(dim, val, el) {
  bf[dim] = val;
  // Update active class only within the same row
  document.querySelectorAll(`.filter-pill[data-dim="${dim}"]`).forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  renderBrowse();
}
function browseSearch() {
  browseSearchQ = document.getElementById('browse-search').value.toLowerCase();
  renderBrowse();
}
function renderBrowse() {
  let filtered = questions.filter(q => {
    if (bf.school !== 'all' && q.source !== bf.school) return false;
    if (bf.year !== 'all' && String(q.year) !== bf.year) return false;
    if (bf.type !== 'all' && q.type !== bf.type) return false;
    if (bf.status !== 'all') {
      const st = getStatus(q.id);
      if (st !== bf.status) return false;
    }
    if (browseSearchQ) {
      const hay = (q.question + ' ' + q.id + ' ' + (q.topic || '') + ' ' + (q.concepts||[]).join(' ')).toLowerCase();
      if (!hay.includes(browseSearchQ)) return false;
    }
    // Active filters from modal (diff/type)
    if (activeFilters.school !== 'all' && q.source !== activeFilters.school) return false;
    if (activeFilters.diff !== 'all' && q.difficulty !== activeFilters.diff) return false;
    if (activeFilters.type !== 'all' && q.type !== activeFilters.type) return false;
    return true;
  });

  const diffMap = {easy:'簡',medium:'中',hard:'難'};
  const list = document.getElementById('browse-list');
  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">🔍</div>找不到符合條件的題目</div>`;
    return;
  }
  list.innerHTML = filtered.slice(0, 100).map(q => {
    const st = getStatus(q.id);
    const tags = q.topic ? [q.topic] : [];
    return `<div class="q-row" onclick="openQuestion('${q.id}')">
      <div class="q-row-status ${st}"></div>
      <div class="q-row-body">
        <div class="q-row-id">${q.id}</div>
        <div class="q-row-text">${q.question.slice(0,55)}${q.question.length>55?'…':''}</div>
        <div class="q-row-tags">${tags.map(c=>`<span class="q-row-tag">${c}</span>`).join('')}</div>
      </div>
      <div class="q-row-diff ${q.difficulty}">${diffMap[q.difficulty]||'?'}</div>
    </div>`;
  }).join('');
  if (filtered.length > 100) {
    list.innerHTML += `<div style="text-align:center;padding:12px;font-size:12px;color:var(--dim)">顯示前100題（共${filtered.length}題），請用搜尋或加篩選縮小範圍</div>`;
  } else {
    list.innerHTML += `<div style="text-align:center;padding:12px;font-size:11px;color:var(--dim)">共 ${filtered.length} 題</div>`;
  }
}

// ─── CHAPTERS ────────────────────────────────────────────────────────────────
function chapterSearch() {
  conceptFilter = document.getElementById('chapter-search').value.toLowerCase();
  renderChapters();
}
function renderChapters() {
  const stats = {};
  questions.forEach(q => {
    const ch = q.topic || '其他';
    const st = getStatus(q.id);
    if (!stats[ch]) stats[ch] = {total:0, correct:0, wrong:0};
    stats[ch].total++;
    if (st==='correct') stats[ch].correct++;
    if (st==='wrong') stats[ch].wrong++;
  });

  let entries = Object.entries(stats)
    .filter(([c]) => !conceptFilter || c.toLowerCase().includes(conceptFilter))
    .sort((a,b) => chapterNum(a[0]) - chapterNum(b[0]));

  const grid = document.getElementById('chapter-grid');
  if (entries.length === 0) {
    grid.innerHTML = `<div class="empty"><div class="empty-icon">📚</div>找不到相符的章節</div>`;
    return;
  }
  grid.innerHTML = entries.map(([c, s]) => {
    const attempted = s.correct + s.wrong;
    let accClass = 'none', accText = '—';
    if (attempted > 0) {
      const acc = s.correct / attempted;
      accClass = acc >= 0.7 ? 'good' : acc >= 0.4 ? 'mid' : 'bad';
      accText = Math.round(acc*100) + '%';
    }
    return `<div class="concept-row" onclick="startChapterQuiz('${esc(c)}')">
      <div class="concept-acc ${accClass}">${accText}</div>
      <div class="concept-name">${c}</div>
      <div class="concept-count">${s.total}題</div>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--dim)" stroke-width="2"><polyline points="9,18 15,12 9,6"/></svg>
    </div>`;
  }).join('');
}

// ─── QUIZ ENGINE ─────────────────────────────────────────────────────────────
function startQuiz(mode) {
  let pool;
  if (mode === 'all') {
    pool = getFilteredPool();
  } else if (mode === 'wrong') {
    pool = questions.filter(q => getStatus(q.id) === 'wrong');
  } else if (mode === 'unsure') {
    pool = questions.filter(q => getStatus(q.id) === 'unsure');
  }
  if (!pool || pool.length === 0) {
    alert(mode === 'wrong' ? '目前沒有答錯的題目！' : mode === 'unsure' ? '目前沒有標記不確定的題目！' : '沒有符合條件的題目');
    return;
  }
  // Shuffle
  quizQueue = [...pool].sort(() => Math.random() - 0.5);
  quizIdx = 0;
  goPage('page-quiz');
  showQuestion();
}

function startChapterQuiz(chapter) {
  const pool = questions.filter(q => (q.topic || '其他') === chapter);
  if (pool.length === 0) return;
  quizQueue = [...pool].sort(() => Math.random() - 0.5);
  quizIdx = 0;
  goPage('page-quiz');
  showQuestion();
}

function openQuestion(id) {
  const idx = questions.findIndex(q => q.id === id);
  if (idx < 0) return;
  quizQueue = [questions[idx]];
  quizIdx = 0;
  goPage('page-quiz');
  showQuestion();
}

function getFilteredPool() {
  return questions.filter(q => {
    if (activeFilters.school !== 'all' && q.source !== activeFilters.school) return false;
    if (activeFilters.diff !== 'all' && q.difficulty !== activeFilters.diff) return false;
    if (activeFilters.type !== 'all' && q.type !== activeFilters.type) return false;
    return true;
  });
}

function showQuestion() {
  if (quizIdx >= quizQueue.length) {
    showQuizDone();
    return;
  }
  currentQ = quizQueue[quizIdx];
  answered = false;
  currentTab = 'steps';

  const pct = (quizIdx / quizQueue.length * 100) + '%';
  document.getElementById('quiz-progress-fill').style.width = pct;
  document.getElementById('quiz-counter').textContent = `${quizIdx+1}/${quizQueue.length}`;

  const isMultiChoice = currentQ.options && currentQ.options.length > 0;
  const status = getStatus(currentQ.id);

  document.getElementById('quiz-body').innerHTML = `
    <div class="q-meta">
      <span class="q-badge school">${currentQ.source}</span>
      <span class="q-badge" style="font-family:'Space Mono',monospace;font-size:11px;color:var(--muted)">${currentQ.id}</span>
      <span class="q-badge type-${({'選擇題':'choice','是非題':'tf','配合題':'match','申論題':'essay','名詞解釋':'essay'}[currentQ.type] || 'choice')}">${currentQ.type}</span>
      ${currentQ.difficulty ? `<span class="q-badge" style="color:${currentQ.difficulty==='hard'?'var(--red)':currentQ.difficulty==='easy'?'var(--green)':'var(--yellow)'}">${{easy:'簡單',medium:'中等',hard:'困難'}[currentQ.difficulty]}</span>` : ''}
      ${isCorrected(currentQ.id) ? `<span class="q-corrected-badge" title="此題已勘誤">✎ 已勘誤</span>` : ''}
      <button class="q-edit-btn" onclick="openEditPanel()" title="編輯勘誤">✏</button>
    </div>

    <div class="q-text">
      ${currentQ.section && currentQ.section.title && currentQ.section.title !== currentQ.type ? `<div class="q-prompt">${currentQ.section.title}</div>` : ''}
      ${currentQ.question}
    </div>

    ${isMultiChoice ? renderOptions() : renderFreeAnswer()}

    <div id="reveal-section" class="reveal-section"></div>

    <div class="action-row" id="action-row">
      ${isMultiChoice
        ? `<button class="btn btn-primary" id="submit-btn" onclick="submitAnswer()" disabled style="opacity:0.5">確認答案</button>`
        : (currentQ.keywords_required && currentQ.keywords_required.length > 0)
          ? `<div style="display:flex;flex-direction:column;gap:6px;width:100%">
               <button class="btn btn-primary" onclick="gradeAnswer()">批改（比對關鍵字）</button>
               <button class="btn btn-ghost" onclick="revealAnswer()" style="font-size:12px">直接看答案</button>
             </div>`
          : `<div style="display:flex;flex-direction:column;gap:6px;width:100%">
               <button class="btn btn-primary" onclick="revealAnswer()">查看答案</button>
               <button class="btn btn-ghost" onclick="nextQuestion()" style="font-size:12px">跳過</button>
             </div>`
      }
    </div>

    <div class="solution-panel" id="solution-panel">
      <div class="solution-tab-row">
        <div class="solution-tab active" onclick="switchTab('steps',this)">解析</div>
        <div class="solution-tab" onclick="switchTab('concept',this)">章節</div>
        <div class="solution-tab" onclick="switchTab('hint',this)">提示</div>
      </div>
      <div class="solution-content active" id="tab-steps">
        ${renderSteps()}
      </div>
      <div class="solution-content" id="tab-concept">
        ${renderConceptTab()}
      </div>
      <div class="solution-content" id="tab-hint">
        ${renderHintTab()}
      </div>
    </div>

    <div>
      <div class="slabel" style="margin-bottom:8px">這題你：</div>
      <div class="mark-row">
        <div class="mark-btn correct-btn ${status==='correct'?'active':''}" onclick="markQ('correct',this)">✓ 懂了</div>
        <div class="mark-btn unsure-btn ${status==='unsure'?'active':''}" onclick="markQ('unsure',this)">⚡ 不確定</div>
        <div class="mark-btn wrong-btn ${status==='wrong'?'active':''}" onclick="markQ('wrong',this)">✗ 不懂</div>
      </div>
    </div>

    <div class="action-row" style="margin-top:4px">
      <button class="btn btn-ghost" onclick="prevQuestion()" ${quizIdx===0?'disabled style="opacity:0.4"':''}>← 上一題</button>
      <button class="btn btn-outline" onclick="nextQuestion()">${quizIdx===quizQueue.length-1?'完成':'下一題 →'}</button>
    </div>
    <div style="height:20px"></div>
  `;
}

function renderOptions() {
  const keys = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  return `<div class="options" id="options-wrap">
    ${(currentQ.options||[]).map((opt, i) => `
      <div class="option" id="opt-${i}" onclick="selectOption(${i})">
        <span class="option-key">${keys[i]}</span>
        <span>${opt.replace(/^\([A-Z]\)\s?|^[A-Z]\.\s?/,'')}</span>
      </div>`).join('')}
  </div>`;
}

function renderFreeAnswer() {
  const kws = currentQ.keywords_required || [];
  const hasKeywords = kws.length > 0;
  return `<div class="answer-input-wrap">
    <textarea class="answer-input" id="free-answer" placeholder="${hasKeywords ? '寫下你的答案，按「批改」對照關鍵字' : '寫下你的思路或答案（選填）'}" rows="4"></textarea>
    ${hasKeywords ? `
      <div class="kw-hint">應包含 ${kws.length} 個關鍵字（批改後顯示）</div>
      <div class="kw-chips" id="kw-chips">${kws.map((k, i) =>
        `<span class="kw-chip" id="kw-${i}">${k}</span>`).join('')}</div>
    ` : ''}
  </div>`;
}

function gradeAnswer() {
  const ta = document.getElementById('free-answer');
  const userText = (ta.value || '').toLowerCase().replace(/\s+/g, '');
  if (!userText) { alert('請先輸入答案再批改'); return; }
  answered = true;
  const kws = currentQ.keywords_required || [];
  let hits = 0;
  kws.forEach((k, i) => {
    const norm = k.toLowerCase().replace(/\s+/g, '');
    const hit = userText.includes(norm);
    const el = document.getElementById('kw-' + i);
    if (el) el.classList.add(hit ? 'hit' : 'miss');
    if (hit) hits++;
  });
  ta.disabled = true;
  const pct = Math.round(hits / kws.length * 100);
  const tone = pct >= 70 ? 'correct' : 'wrong';
  const rev = document.getElementById('reveal-section');
  rev.className = 'reveal-section ' + (tone === 'correct' ? 'correct-reveal' : 'wrong-reveal');
  rev.innerHTML = `<div class="reveal-result ${tone}">命中 ${hits}/${kws.length} 個關鍵字（${pct}%）</div>`;
  document.getElementById('solution-panel').classList.add('show');
  document.getElementById('action-row').style.display = 'none';
}

let selectedOpt = null;
function selectOption(i) {
  if (answered) return;
  selectedOpt = i;
  document.querySelectorAll('.option').forEach((el,j) => {
    el.classList.toggle('selected', j === i);
  });
  const btn = document.getElementById('submit-btn');
  if (btn) { btn.disabled = false; btn.style.opacity = '1'; }
}

function submitAnswer() {
  if (selectedOpt === null || answered) return;
  answered = true;
  const keys = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  const correctAns = (currentQ.answer || '').toUpperCase().trim();
  const chosenKey = keys[selectedOpt];
  const isCorrect = correctAns && chosenKey === correctAns;

  // Color options
  document.querySelectorAll('.option').forEach((el, i) => {
    const key = keys[i];
    if (key === correctAns) el.classList.add('reveal-correct');
    else if (i === selectedOpt && !isCorrect) el.classList.add('wrong');
    el.classList.remove('selected');
  });

  // Reveal section
  const rev = document.getElementById('reveal-section');
  if (isCorrect) {
    rev.className = 'reveal-section correct-reveal';
    rev.innerHTML = `<div class="reveal-result correct">✓ 答對了！</div>`;
  } else {
    rev.className = 'reveal-section wrong-reveal';
    rev.innerHTML = `<div class="reveal-result wrong">✗ 答錯了</div><div class="reveal-ans">正確答案：${correctAns}</div>`;
  }

  // Show solution
  document.getElementById('solution-panel').classList.add('show');
  document.getElementById('action-row').style.display = 'none';

  // Auto-mark
  if (!records[currentQ.id]) {
    markQ(isCorrect ? 'correct' : 'wrong', null, true);
  }
}

function revealAnswer() {
  answered = true;
  document.getElementById('solution-panel').classList.add('show');
  const rev = document.getElementById('reveal-section');
  const ans = currentQ.answer || '（詳見解析）';
  rev.className = 'reveal-section correct-reveal';
  rev.innerHTML = `<div class="reveal-ans">✦ 答案：<strong style="color:var(--green)">${ans}</strong></div>`;
  document.getElementById('action-row').style.display = 'none';
}

function renderSteps() {
  // For 普心: use reference_answer (long explanation), essay_outline, and answer_note
  const ref = currentQ.reference_answer || '';
  const note = currentQ.answer_note || '';
  const conf = currentQ.answer_confidence || '';
  const outline = currentQ.essay_outline || [];
  const personal = getPersonalNote(currentQ.id);
  let html = '';
  if (conf === 'medium' || conf === 'low') {
    html += `<div style="font-size:11px;color:var(--yellow);background:var(--yellow-bg);border:1px solid rgba(245,200,66,0.3);border-radius:6px;padding:6px 10px;margin-bottom:10px">⚠ 答案信心度：${conf}　待勘誤</div>`;
  }
  if (personal) {
    html += `<div class="personal-note-label">📝 我的備註</div>
      <div class="personal-note-box">${personal.replace(/</g,'&lt;')}</div>`;
  }
  if (ref) {
    html += `<div class="key-box" style="margin-bottom:10px;line-height:1.7">${ref}</div>`;
  }
  if (outline.length > 0) {
    html += `<div class="slabel" style="margin-top:12px">答題重點</div>
      <div class="steps">${outline.map((s, i) => `
        <div class="step"><span class="step-n">${String(i+1).padStart(2,'0')}</span><span>${s}</span></div>`).join('')}
      </div>`;
  }
  if (note) {
    html += `<div style="font-size:11px;color:var(--muted);padding:6px 4px 0">${note}</div>`;
  }
  if (!html) return `<div style="color:var(--dim);font-size:13px">尚無解析</div>`;
  return html;
}

function renderConceptTab() {
  // For 普心: show topic (chapter), key_concepts, scholars, school_of_thought
  const topic = currentQ.topic || '';
  const key = currentQ.key_concepts || '';
  const scholars = currentQ.scholars || [];
  const sot = currentQ.school_of_thought || '';
  const concepts = currentQ.concepts || [];
  let html = '';
  if (topic) {
    html += `<div class="slabel">章節</div>
      <div class="concept-tags" style="margin-bottom:12px">
        <span class="concept-tag" onclick="startChapterQuiz('${esc(topic)}')">${topic}</span>
      </div>`;
  }
  if (key) {
    html += `<div class="slabel">核心概念</div><div class="key-box" style="margin-bottom:12px">${key}</div>`;
  }
  if (scholars.length > 0) {
    html += `<div class="slabel">關鍵學者</div>
      <div class="concept-tags" style="margin-bottom:12px">${scholars.map(s=>`<span class="concept-tag">${s}</span>`).join('')}</div>`;
  }
  if (sot) {
    html += `<div class="slabel">學派</div><div style="font-size:13px;margin-bottom:12px">${sot}</div>`;
  }
  if (concepts.length > 0) {
    html += `<div class="slabel">考點標籤</div>
      <div class="concept-tags">${concepts.map(c=>`<span class="concept-tag">${c}</span>`).join('')}</div>`;
  }
  if (!html) return `<div style="color:var(--dim);font-size:13px">尚無章節資訊</div>`;
  return html;
}

function renderHintTab() {
  const hint = currentQ.ai_hint || '';
  if (!hint) return `<div style="color:var(--dim);font-size:13px">尚無提示</div>`;
  return `<div class="hint-label">💡 AI 提示</div><div class="hint-box">${hint}</div>`;
}

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.solution-tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.solution-content').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('tab-' + tab).classList.add('active');
}

function markQ(status, el, auto=false) {
  if (!currentQ) return;
  records[currentQ.id] = { status, ts: Date.now() };
  saveRecords();
  updateHeaderSub();
  if (!auto) {
    document.querySelectorAll('.mark-btn').forEach(b => {
      b.classList.remove('active');
    });
    if (el) el.classList.add('active');
  }
}

function nextQuestion() {
  quizIdx++;
  showQuestion();
}
function prevQuestion() {
  if (quizIdx > 0) { quizIdx--; showQuestion(); }
}
function exitQuiz() {
  goPage('page-home');
  renderHome();
}

function showQuizDone() {
  const correct = quizQueue.filter(q => records[q.id]?.status === 'correct').length;
  const wrong = quizQueue.filter(q => records[q.id]?.status === 'wrong').length;
  document.getElementById('quiz-body').innerHTML = `
    <div style="text-align:center;padding:48px 24px">
      <div style="font-size:40px;margin-bottom:16px">🎉</div>
      <div style="font-size:18px;font-weight:700;margin-bottom:8px">完成！</div>
      <div style="font-size:13px;color:var(--muted);margin-bottom:24px">${quizQueue.length} 題刷完了</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:24px">
        <div class="stat-card"><div class="stat-num green">${correct}</div><div class="stat-label">答對</div></div>
        <div class="stat-card"><div class="stat-num red">${wrong}</div><div class="stat-label">答錯</div></div>
      </div>
      <button class="btn btn-primary" onclick="exitQuiz()" style="width:100%;margin-bottom:8px">回到主頁</button>
      <button class="btn btn-outline" onclick="startQuiz('wrong')" style="width:100%">複習錯題</button>
    </div>
  `;
}

// ─── FILTERS ─────────────────────────────────────────────────────────────────
function openFilter() { document.getElementById('filter-modal').classList.add('show'); }
function closeFilter() { document.getElementById('filter-modal').classList.remove('show'); }
function toggleFilter(el) {
  const key = el.dataset.key;
  const val = el.dataset.val;
  document.querySelectorAll(`[data-key="${key}"]`).forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  activeFilters[key] = val;
}
function resetFilters() {
  activeFilters = { school: 'all', diff: 'all', type: 'all' };
  document.querySelectorAll('.filter-chip').forEach(el => {
    el.classList.toggle('active', el.dataset.val === 'all');
  });
}
function applyFilters() {
  closeFilter();
  renderBrowse();
}

// ─── UTILS ───────────────────────────────────────────────────────────────────
function esc(str) { return (str||'').replace(/'/g,"\\'").replace(/"/g,'&quot;'); }

// ─── PWA ─────────────────────────────────────────────────────────────────────
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

init();
</script>
</body>
</html>
